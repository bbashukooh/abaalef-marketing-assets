name: Clean Descript footer from Baba Alef practice media
on:
  push:
    paths:
      - '.github/workflows/clean-babaalef-practice.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install --quiet Pillow
      - name: Remove the fixed Descript footer and keep original sound
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          root=Path('campaigns/2026-11-22-audio')
          src=root/'04-practice.mp4'
          dst=root/'04-practice-clean.mp4'
          meta=json.loads(subprocess.check_output(
              ['ffprobe','-v','error','-select_streams','v:0',
               '-show_entries','stream=width,height','-of','json',str(src)],text=True))
          w,h=[meta['streams'][0][v] for v in ('width','height')]
          # Only the small lower-right watermark added by Descript.
          # The approved babaalef.com logo above it remains untouched.
          x,y=int(w*.54),int(h*.908)
          rw,rh=int(w*.40),int(h*.076)
          assert x+rw<w and y+rh<h, (w,h,x,y,rw,rh)
          print('Frame size',w,h,'footer correction',x,y,rw,rh,flush=True)
          subprocess.run([
            'ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(src),
            '-vf',f'delogo=x={x}:y={y}:w={rw}:h={rh}',
            '-c:v','libx264','-preset','veryfast','-crf','19','-pix_fmt','yuv420p',
            '-c:a','copy','-movflags','+faststart',str(dst)],check=True)
          assert dst.stat().st_size>500000
          subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y',
                          '-ss','12','-i',str(dst),'-frames:v','1','-q:v','2',
                          str(root/'source/_review-clean-practice-frame.jpg')],check=True)
          PY
      - name: Rebuild full compilation in requested slide order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path('campaigns/2026-11-22-audio').resolve()))
          import render_clean
          render_clean.concat_final()
          PY
      - name: Verify video streams and durations
        shell: bash
        run: |
          set -euo pipefail
          cd campaigns/2026-11-22-audio
          python3 - <<'PY'
          import subprocess
          for f,lower,upper in [('04-practice-clean.mp4',33,36),
                                ('05-all-slides-clean-reordered.mp4',58,68)]:
              s=subprocess.check_output(['ffprobe','-v','error','-show_entries',
                 'format=duration','-of','default=noprint_wrappers=1:nokey=1',f],text=True)
              d=float(s.strip())
              assert lower<d<upper, (f,d)
              print('Verified',f,d,flush=True)
          PY
      - name: Commit reviewed watermark-free files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add campaigns/2026-11-22-audio/04-practice-clean.mp4 campaigns/2026-11-22-audio/05-all-slides-clean-reordered.mp4 campaigns/2026-11-22-audio/source/_review-clean-practice-frame.jpg
          git diff --cached --quiet && exit 0
          git commit -m 'Replace Descript-watermarked video with cleaned practice and reordered compilation'
          git push
