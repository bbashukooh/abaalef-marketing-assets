name: Render Baba Alef audio campaign without Descript watermark
on:
  push:
    paths:
      - '.github/workflows/render-babaalef-audio-clean.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install --quiet Pillow pydub
      - name: Render slides and reordered video from locked originals
        shell: bash
        run: |
          set -euo pipefail
          python3 campaigns/2026-11-22-audio/render_clean.py
      - name: Validate all outputs and capture original practice reference frame
        shell: bash
        run: |
          set -euo pipefail
          cd campaigns/2026-11-22-audio
          ffmpeg -hide_banner -loglevel error -y -ss 12 -i 04-practice.mp4 -frames:v 1 -q:v 2 source/_review-practice-frame.jpg
          for name in 02-letters-clean.mp4 03-words-clean.mp4 05-all-slides-clean-reordered.mp4; do
            test -s "$name"
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$name"
            ffprobe -v error -select_streams a -show_entries stream=codec_name -of csv=p=0 "$name" | grep -q aac
          done
      - name: Commit watermark-free renders
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add campaigns/2026-11-22-audio/02-letters-clean.mp4 campaigns/2026-11-22-audio/03-words-clean.mp4 campaigns/2026-11-22-audio/05-all-slides-clean-reordered.mp4 campaigns/2026-11-22-audio/source/_review-practice-frame.jpg
          git diff --cached --quiet && exit 0
          git commit -m 'Add clean original-audio animations and reordered campaign video'
          git push
