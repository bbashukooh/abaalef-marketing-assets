name: Probe accessible Descript campaign video media
on:
  push:
    paths:
      - '.github/workflows/import-audio-campaign-20261122.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser for extracting public video stream URLs
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium --with-deps
      - name: Inspect publicly shared videos
        run: |
          python3 - <<'PY'
          import asyncio,urllib.parse
          from playwright.async_api import async_playwright
          URLS=["https://share.descript.com/view/j3eZl7P5aPV","https://share.descript.com/view/82ol8Yn8Jpj"]
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True)
                  for i,url in enumerate(URLS):
                      page=await b.new_page()
                      candidates=[]
                      def logrequest(request):
                          u=request.url
                          if any(x in u.lower() for x in ['m3u8','mp4','mpd','video/','master.json','playlist','manifest']):
                              candidates.append(u)
                      page.on('request',logrequest)
                      try:
                          await page.goto(url,wait_until='domcontentloaded',timeout=50000)
                          await page.wait_for_timeout(14000)
                          print('PAGE',i,'title',await page.title())
                          for j,frame in enumerate(page.frames):
                              try:
                                  nodes=await frame.locator('video').evaluate_all('(els)=>els.map(e=>({src:e.src,currentSrc:e.currentSrc,readyState:e.readyState}))')
                                  if nodes: print('VIDEO',i,j,str(nodes)[:200])
                              except Exception as e: print('FRAMERR',str(e)[:120])
                          print('CAPTURED',i,len(candidates))
                          for u in dict.fromkeys(candidates):
                              z=urllib.parse.urlparse(u)
                              print('SOURCE',i,z.scheme+'://'+z.hostname+z.path[:160])
                      except Exception as e:
                          print('ERROR',i,str(e)[:500])
                      await page.close()
                  await b.close()
          asyncio.run(main())
          PY
