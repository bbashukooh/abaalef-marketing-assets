name: Import Baba Alef audio campaign 2026-11-22
on:
  push:
    paths:
      - '.github/workflows/import-audio-campaign-20261122.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original approved campaign media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p campaigns/2026-11-22-audio
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 --max-time 240 'https://at.adobe.com/VCdtamryO8XIcf1u' -o 'campaigns/2026-11-22-audio/01-cover.png'
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 --max-time 240 'https://media.descriptusercontent.com/v3/proxy/remux?url=https%3A%2F%2Fapi.descript.com%2Fv2%2Fpublished_projects%2F86d8fd48-dfee-46d3-880a-5bea1d0f8a41%2Fhls%3Fexpiration%3D1795445722273%26signature%3D1b5dbb0e617b3648b5d395bcb8de5bd928b129b4282be3723dd29e0a034a826f&filename=02+Animated.mp4&mediaCacheBucketName=production-273614-media-cache&expiration=1795442122&signature=2c2846df435fa4320f84bcbb8d8f966303dcf46a54c63f0032a3b5f22d6c' -o 'campaigns/2026-11-22-audio/02-letters-animated.mp4'
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 --max-time 240 'https://media.descriptusercontent.com/v3/proxy/remux?url=https%3A%2F%2Fapi.descript.com%2Fv2%2Fpublished_projects%2Ff74f08d4-8893-4991-a732-d1e3d017c5e7%2Fhls%3Fexpiration%3D1795445724585%26signature%3De15154fb2193d8ea4b8e41359e45b82379ba6a0378a2f80fb91709bb12754b2d&filename=03+Animated.mp4&mediaCacheBucketName=production-273614-media-cache&expiration=1795442125&signature=26ccbc4c4ced52ea4c4e3b2725d260184682aaf553342c22b5107e65b7fee340' -o 'campaigns/2026-11-22-audio/03-words-animated.mp4'
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 --max-time 240 'https://at.adobe.com/m8ydulBAUTDe8VFw' -o 'campaigns/2026-11-22-audio/04-practice-original.mp4'
      - name: Validate all assets and original file checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('campaigns/2026-11-22-audio')
          files = ['01-cover.png', '02-letters-animated.mp4', '03-words-animated.mp4', '04-practice-original.mp4']
          for name in files:
              p = root/name
              assert p.exists() and p.stat().st_size > 100_000, f'Missing/empty asset: {name}'
              header = p.read_bytes()[:12]
              if name.endswith('.png'):
                  assert header[:8] == b'\x89PNG\r\n\x1a\n', f'Invalid PNG: {name}'
              else:
                  assert header[4:8] == b'ftyp', f'Invalid MP4: {name}'
              print(name, p.stat().st_size, hashlib.sha256(p.read_bytes()).hexdigest())
          assert (root/'01-cover.png').stat().st_size == 1905486
          assert hashlib.sha256((root/'01-cover.png').read_bytes()).hexdigest() == 'a8737dd51c09ab9d2c8aa99ef7c77c2580adb9ddde4c5be9b2344d5c2a16de10'
          assert (root/'04-practice-original.mp4').stat().st_size == 21238226
          assert hashlib.sha256((root/'04-practice-original.mp4').read_bytes()).hexdigest() == '23b339479ad65836e7c950fee61cd1d630304e904e899b6c8d0ecb5b7a17f8b0'
          PY
      - name: Commit the four verified assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add campaigns/2026-11-22-audio/
          if git diff --cached --quiet; then echo 'Assets already imported'; exit 0; fi
          git commit -m 'Stage Baba Alef 22 Nov audio campaign originals for Buffer'
          git push
