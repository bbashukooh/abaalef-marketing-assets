name: Import combined Baba Alef audio campaign TikTok and X video
on:
  push:
    paths:
      - '.github/workflows/import-audio-campaign-20261122.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install required media tools
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium --with-deps
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Download approved full carousel compilation for TikTok and X
        run: |
          set -euo pipefail
          mkdir -p campaigns/2026-11-22-audio
          python3 - <<'PY'
          import asyncio, subprocess
          from pathlib import Path
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True)
                  page=await browser.new_page()
                  await page.goto('https://share.descript.com/view/D5lqOCp9xNN',wait_until='domcontentloaded',timeout=60000)
                  await page.locator('video').first.wait_for(timeout=30000)
                  source=await page.locator('video').first.get_attribute('src')
                  assert source and source.startswith('https://api.descript.com/'), 'Missing original practice video stream'
                  dest=Path('campaigns/2026-11-22-audio/05-all-slides-tiktok-x.mp4')
                  subprocess.run(['ffmpeg','-nostdin','-loglevel','error','-y','-headers','Referer: https://share.descript.com/\r\n','-i',source,'-c','copy','-movflags','+faststart',str(dest)],check=True)
                  assert dest.is_file() and dest.stat().st_size>100000, 'Practice video is missing'
                  info=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(dest)],capture_output=True,text=True,check=True)
                  duration=float(info.stdout.strip())
                  assert 60<duration<66, f'Unexpected duration: {duration}'
                  print('Verified full audio carousel video',dest.stat().st_size,'bytes; duration',duration)
                  await browser.close()
          asyncio.run(main())
          PY
      - name: Commit verified full video
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+bbashukooh@users.noreply.github.com'
          git add campaigns/2026-11-22-audio/05-all-slides-tiktok-x.mp4
          git diff --cached --quiet && exit 0
          git commit -m 'Add approved merged audio campaign video for TikTok and X'
          git push
