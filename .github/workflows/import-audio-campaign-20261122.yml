name: Import approved Baba Alef audio clips from public Descript video sources
on:
  push:
    paths:
      - '.github/workflows/import-audio-campaign-20261122.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium --with-deps
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Download directly from the approved video players
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p campaigns/2026-11-22-audio
          python3 - <<'PY'
          import asyncio,subprocess
          from pathlib import Path
          from playwright.async_api import async_playwright
          videos=[
            ('https://share.descript.com/view/j3eZl7P5aPV','02-letters-animated.mp4'),
            ('https://share.descript.com/view/82ol8Yn8Jpj','03-words-animated.mp4')
          ]
          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch()
              for pageurl,filename in videos:
                page=await browser.new_page()
                await page.goto(pageurl,wait_until='domcontentloaded',timeout=60000)
                await page.locator('video').first.wait_for(timeout=30000)
                source=await page.locator('video').first.get_attribute('src')
                assert source and source.startswith('https://api.descript.com/'), filename
                dest=str(Path('campaigns/2026-11-22-audio')/filename)
                print('Extracting',filename, 'from authenticated public player stream')
                subprocess.run(['ffmpeg','-nostdin','-loglevel','error','-y','-headers','Referer: https://share.descript.com/\r\n','-i',source,'-c','copy','-movflags','+faststart',dest],check=True)
                assert Path(dest).stat().st_size>100000,filename
                print('Verified',filename,Path(dest).stat().st_size)
                await page.close()
              await browser.close()
          asyncio.run(main())
          PY
      - name: Commit validated media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add campaigns/2026-11-22-audio/02-letters-animated.mp4 campaigns/2026-11-22-audio/03-words-animated.mp4
          git diff --cached --quiet && exit 0
          git commit -m 'Add approved animated letter and word audio videos'
          git push
