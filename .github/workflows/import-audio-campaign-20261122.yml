name: Import public Descript previews for Baba Alef audio campaign
on:
  push:
    paths:
      - '.github/workflows/import-audio-campaign-20261122.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stream download dependency
        run: python3 -m pip install --quiet yt-dlp
      - name: Download approved previews from Descript's unlisted share URLs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p campaigns/2026-11-22-audio
          yt-dlp --verbose --no-playlist -f 'bv*+ba/best' --merge-output-format mp4 -o 'campaigns/2026-11-22-audio/02-letters-animated.%(ext)s' 'https://share.descript.com/view/j3eZl7P5aPV'
          yt-dlp --verbose --no-playlist -f 'bv*+ba/best' --merge-output-format mp4 -o 'campaigns/2026-11-22-audio/03-words-animated.%(ext)s' 'https://share.descript.com/view/82ol8Yn8Jpj'
      - name: Validate videos before publishing files in GitHub
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ('02-letters-animated.mp4','03-words-animated.mp4'):
              p = Path('campaigns/2026-11-22-audio') / name
              assert p.is_file() and p.stat().st_size > 100000, name
              assert p.read_bytes()[:12][4:8] == b'ftyp', name
              print('Verified', name, p.stat().st_size)
          PY
      - name: Commit validated videos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add campaigns/2026-11-22-audio/02-letters-animated.mp4 campaigns/2026-11-22-audio/03-words-animated.mp4
          git diff --cached --quiet && exit 0
          git commit -m 'Stage verified original audio demo videos'
          git push
