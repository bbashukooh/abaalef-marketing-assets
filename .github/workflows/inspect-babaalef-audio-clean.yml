name: Validate clean Baba Alef carousel preview frames
on:
  push:
    paths:
      - '.github/workflows/inspect-babaalef-audio-clean.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract highlight review frames
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          cd campaigns/2026-11-22-audio
          ffmpeg -hide_banner -loglevel error -y -ss 0.9 -i 02-letters-clean.mp4 -frames:v 1 -q:v 2 source/_review-letters-highlight.jpg
          ffmpeg -hide_banner -loglevel error -y -ss 0.9 -i 03-words-clean.mp4 -frames:v 1 -q:v 2 source/_review-words-highlight.jpg
          ffmpeg -hide_banner -loglevel error -y -ss 15 -i 05-all-slides-clean-reordered.mp4 -frames:v 1 -q:v 2 source/_review-reordered-practice.jpg
      - name: Commit review frames
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add campaigns/2026-11-22-audio/source/_review-*.jpg
          git diff --cached --quiet && exit 0
          git commit -m 'Verify final audio highlight and reordered practice preview frames'
          git push
